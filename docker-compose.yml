name: devlog

services:

  # ─── Data layer ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine          # Alpine = smaller image
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"                    # Exposed locally so you can connect with DBeaver/psql
    volumes:
      - postgres_data:/var/lib/postgresql/data   # Named volume = data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development            # Multi-stage: we'll define this in the Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
      - "5005:5005"                  # JVM remote debug port
    volumes:
      - ./backend:/app               # Mount source for hot reload in dev
      - gradle_cache:/root/.gradle   # Cache dependencies between restarts
    depends_on:
      postgres:
        condition: service_healthy   # Won't start until postgres passes health check
      redis:
        condition: service_healthy

  # ─── Frontend: Dashboard ─────────────────────────────────────
  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-dashboard:/app
      - dashboard_node_modules:/app/node_modules   # Prevent host modules from overriding
    depends_on:
      - backend

  # ─── Frontend: Public site ────────────────────────────────────
  frontend-public:
    build:
      context: ./frontend-public
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    ports:
      - "4321:4321"
    volumes:
      - ./frontend-public:/app
      - public_node_modules:/app/node_modules

  # ─── Reverse proxy ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"                      # Single entry point in dev
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend-dashboard
      - frontend-public

volumes:
  postgres_data:
  redis_data:
  gradle_cache:
  dashboard_node_modules:
  public_node_modules: