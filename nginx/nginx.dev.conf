## Git Branching Strategy
```
main          ← production-ready only. Protected branch. Never push directly.
develop       ← integration branch. All features merge here first.
feature/*     ← one branch per feature. e.g. feature/post-crud
fix/*         ← bug fixes. e.g. fix/jwt-expiry-refresh