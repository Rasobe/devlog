# nginx/nginx.dev.conf

upstream backend {
    server backend:8080;
}

upstream dashboard {
    server frontend-dashboard:3000;
}

upstream public_site {
    server frontend-public:4321;
}

server {
    listen 80;
    server_name localhost;

    # Backend API — all /api/* requests go to Spring Boot
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin dashboard
    location /admin/ {
        proxy_pass http://dashboard;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;   # Required for Next.js HMR WebSocket
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }

    # Public blog — catch all
    location / {
        proxy_pass http://public_site;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}
```

